version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: smart-door-backend
    ports:
      - "4000:4000"
    env_file:
      - .env  # เปลี่ยนให้อ่านจาก root folder (ไฟล์เดียวกัน)
    networks:
      - smart-door-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: smart-door-frontend
    ports:
      - "4001:80"
    env_file:
      - .env  # เปลี่ยนให้อ่านจาก root folder เช่นกัน
    depends_on:
      - backend
    networks:
      - smart-door-net
    restart: unless-stopped

networks:
  smart-door-net:
    driver: bridge